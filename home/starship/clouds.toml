"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_bg)\
$os\
$username\
[](fg:color_fg bg:color_bg)\
$directory\
[](fg:color_fg bg:color_bg)\
$cmd_duration\
[](fg:color_fg bg:color_bg)\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:color_fg bg:color_bg)\
$time\
[ ](fg:color_bg)\
$line_break$character"""

palette = 'clouds'

[palettes.clouds]
color_fg = '#007382'
color_bg = '#CCC9C7'
color_red = '#E77382'

[os]
disabled = false
style = "bg:color_bg fg:color_fg"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""
NixOS = " "

[username]
show_always = true
style_user = "bg:color_bg fg:color_fg"
style_root = "bg:color_bg fg:color_fg"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg bg:color_bg"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[cmd_duration]
disabled = false
style = "fg:color_fg bg:color_bg"
show_milliseconds = true
format = "[ 󱎫 $duration ]($style)"
min_time = 1

[nodejs]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[c]
symbol = " "
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[cpp]
symbol = " "
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[rust]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[golang]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[php]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[java]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[kotlin]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[haskell]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[python]
symbol = ""
style = "bg:color_bg"
format = '[[ $symbol( $version) ](fg:color_fg bg:color_bg)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg"
format = '[[  $time ](fg:color_fg bg:color_bg)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_fg)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_fg)'
vimcmd_replace_one_symbol = '[](bold fg:color_fg)'
vimcmd_replace_symbol = '[](bold fg:color_fg)'
vimcmd_visual_symbol = '[](bold fg:color_fg)'
